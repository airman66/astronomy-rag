services:
  glossary-rag:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      ASSISTANT_PROVIDER:
      ASSISTANT_DEADLINE:
      DEEPSEEK_API_KEY:
      DEEPSEEK_MODEL:
      RUNPOD_API_KEY:
      RUNPOD_ENDPOINT_ID:
      RUNPOD_MODEL:
      CORS_ORIGINS:
      TRUSTED_PROXIES:
      SESSION_SECRET:
      EMBEDDING_TIMEOUT:
      SEMANTIC_MIN_SCORE:
      SEMANTIC_POOL:
      EMBEDDING_URL: ${EMBEDDING_URL:-http://embeddings:8080/v1/embeddings}
      REDIS_URL: redis://redis:6379/0
      CATALOG_DB_PATH: /app/state/glossary.db
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - catalog-db:/app/state
    restart: unless-stopped
  model-fetch:
    profiles: ["embeddings"]
    image: &llama-server ghcr.io/ggml-org/llama.cpp:server
    entrypoint: ["/bin/sh", "/scripts/fetch_model.sh"]
    volumes:
      - ./data/models:/models
      - ./scripts/index/fetch_model.sh:/scripts/fetch_model.sh:ro
  embeddings:
    profiles: ["embeddings"]
    image: *llama-server
    depends_on:
      model-fetch:
        condition: service_completed_successfully
    command:
      - -m
      - /models/Qwen3-Embedding-8B-Q4_K_M.gguf
      - --embedding
      - --pooling
      - last
      - -c
      - "4096"
      - -b
      - "4096"
      - -ub
      - "2048"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - ./data/models:/models:ro
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  catalog-db:
