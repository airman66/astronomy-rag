name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip check
      - name: Test code and data
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/basedpyright
          .venv/bin/python -m app.audit --skip-original-media
          .venv/bin/python -m scripts.illustrations verify --complete
          .venv/bin/python -m scripts.evaluate --retrieval-only --check --output /tmp/rag-retrieval.json
      - name: Start Docker on a clean checkout
        run: docker compose up --build -d --wait --wait-timeout 90
      - name: Check HTTP endpoints, WebP, and Redis rate limiting
        run: |
          docker compose run -d --no-deps --name astronomy-rag-smoke-peer -p 127.0.0.1:8002:8000 -e CATALOG_DB_PATH=/tmp/glossary.db glossary-rag
          curl -fsS --retry 15 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:8002/health
          .venv/bin/python -m scripts.smoke_http http://127.0.0.1:8001 --peer http://127.0.0.1:8002 --search-mode lexical
      - name: Docker logs
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop Docker
        if: always()
        run: |
          if docker container inspect astronomy-rag-smoke-peer >/dev/null 2>&1; then
            docker rm -f astronomy-rag-smoke-peer
          fi
          docker compose down -v
