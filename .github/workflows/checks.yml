name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip check
      - name: Test code and data
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/basedpyright
          .venv/bin/python -m app.audit --skip-original-media
          .venv/bin/python -m scripts.illustrations verify --complete
      - name: Start Docker on a clean checkout
        run: docker compose up --build -d --wait --wait-timeout 90
      - name: Check HTTP endpoints
        run: |
          base=http://127.0.0.1:8001
          curl -fsS "$base/health"
          curl -fsS "$base/docs" > /dev/null
          curl -fsS "$base/openapi.json" > /dev/null
          curl -fsS "$base/api/v1/terms" | python -c 'import json, sys; assert json.load(sys.stdin)["total"] == 501'
      - name: Docker logs
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop Docker
        if: always()
        run: docker compose down -v
